<!DOCTYPE html>
<html lang="tr" data-bs-theme="light">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>{{ info.title }}</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
            rel="stylesheet"
        />
        <style>
            :root {
                --gradient-primary: linear-gradient(
                    135deg,
                    #6366f1 0%,
                    #a855f7 100%
                );
                --glass-bg-light: rgba(255, 255, 255, 0.95);
                --glass-bg-dark: rgba(30, 30, 30, 0.95);
                --nav-blur: blur(10px);
            }

            body {
                background: var(--gradient-primary);
                min-height: 100vh;
                transition: background 0.3s ease;
            }

            .nav-blur {
                background: var(--primary-gradient);
                backdrop-filter: var(--nav-blur);
                box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            }

            .dark-mode .nav-blur {
                background: rgba(0, 0, 0, 0.75) !important;
            }

            .glass-card {
                background: var(--glass-bg-light);
                backdrop-filter: blur(12px);
                border-radius: 1.5rem;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
                border: 1px solid rgba(255, 255, 255, 0.2);
                padding: 2rem;
            }

            .dark-mode .glass-card {
                background: var(--glass-bg-dark);
                border-color: rgba(255, 255, 255, 0.1);
            }

            .video-thumbnail {
                border-radius: 1rem;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
                max-width: 720px;
                margin: 2rem auto;
            }

            .format-option {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 1rem;
                margin: 0.75rem 0;
                border-radius: 0.75rem;
                background: rgba(255, 255, 255, 0.1);
                transition: all 0.2s ease;
            }

            .format-option:hover {
                transform: translateX(8px);
                background: rgba(99, 102, 241, 0.1);
            }

            .nav-pills .nav-link {
                border-radius: 0.75rem;
                margin: 0 0.5rem;
                padding: 1rem 1.5rem;
                transition: all 0.3s ease;
            }

            .nav-pills .nav-link.active {
                background: var(--gradient-primary) !important;
                box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            }

            .btn-glow {
                background: var(--gradient-primary);
                border: none;
                color: white;
                padding: 1rem 2rem;
                border-radius: 0.75rem;
                transition: all 0.3s ease;
            }

            .btn-glow:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
            }
        </style>
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark nav-blur py-3">
            <div class="container">
                <a
                    class="navbar-brand fw-bold d-flex align-items-center"
                    href="{{ url_for('index') }}"
                >
                    <i class="bi bi-download me-2 fs-4"></i>
                    <span>VideoMania</span>
                </a>
                <div class="form-check form-switch ms-auto">
                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="themeSwitch"
                        role="switch"
                    />
                    <label class="form-check-label" for="themeSwitch">
                        <i class="bi bi-moon-stars fs-5"></i>
                    </label>
                </div>
            </div>
        </nav>

        <main class="container my-5">
            <div class="glass-card">
                <div class="text-center mb-5">
                    <h1 class="fw-bold mb-4">{{ info.title }}</h1>
                    {% if info.thumbnail %}
                    <img
                        src="{{ info.thumbnail }}"
                        alt="Thumbnail"
                        class="video-thumbnail img-fluid"
                    />
                    {% endif %}
                </div>

                <ul
                    class="nav nav-pills nav-justified mb-5"
                    id="downloadTab"
                    role="tablist"
                >
                    <li class="nav-item" role="presentation">
                        <button
                            class="nav-link active"
                            data-bs-toggle="tab"
                            data-bs-target="#combined"
                        >
                            <i class="bi bi-lightning-charge me-2"></i>Hızlı
                            İndir
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button
                            class="nav-link"
                            data-bs-toggle="tab"
                            data-bs-target="#videoOnly"
                        >
                            <i class="bi bi-camera-video me-2"></i>Sadece Video
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button
                            class="nav-link"
                            data-bs-toggle="tab"
                            data-bs-target="#audioOnly"
                        >
                            <i class="bi bi-music-note me-2"></i>Sadece Ses
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button
                            class="nav-link"
                            data-bs-toggle="tab"
                            data-bs-target="#custom2"
                        >
                            <i class="bi bi-gear me-2"></i>Gelişmiş
                        </button>
                    </li>
                </ul>

                <div class="tab-content">
                    <!-- Hızlı İndir Sekmesi -->
                    <div class="tab-pane fade show active" id="combined">
                        <form action="{{ url_for('download') }}" method="post">
                            <input
                                type="hidden"
                                name="video_url"
                                value="{{ info.webpage_url }}"
                            />
                            <input type="hidden" name="mode" value="combined" />

                            <div class="mb-4">
                                <label class="form-label fw-bold mb-3"
                                    >Kalite Seçimi</label
                                >
                                <select
                                    class="form-select form-select-lg"
                                    name="format_id"
                                    required
                                >
                                    {% for f in combined_formats %}
                                    <option
                                        value="{{ f.format_id }}"
                                        class="format-option"
                                    >
                                        {{ f.format }} - {{ f.ext }}{% if f.abr
                                        %} ({{ f.abr }} kbps){% endif %}{% if
                                        f.filesize and f.filesize > 0 %} - {{
                                        (f.filesize/1024/1024)|round(2) }} MB{%
                                        else %} (Boyut bilinmiyor){% endif %}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <button type="submit" class="btn-glow w-100">
                                <i class="bi bi-download me-2"></i>İndirmeye
                                Başla
                            </button>
                        </form>
                    </div>

                    <!-- Sadece Video Sekmesi -->
                    <div class="tab-pane fade" id="videoOnly">
                        <form action="{{ url_for('download') }}" method="post">
                            <input
                                type="hidden"
                                name="video_url"
                                value="{{ info.webpage_url }}"
                            />
                            <input
                                type="hidden"
                                name="mode"
                                value="video_only"
                            />

                            <div class="mb-4">
                                <label class="form-label fw-bold mb-3"
                                    >Video Kalitesi</label
                                >
                                <select
                                    class="form-select form-select-lg"
                                    name="format_id"
                                    required
                                >
                                    {% for f in video_only_formats %}
                                    <option
                                        value="{{ f.format_id }}"
                                        class="format-option"
                                    >
                                        {{ f.format }} - {{ f.ext }}{% if f.abr
                                        %} ({{ f.abr }} kbps){% endif %}{% if
                                        f.filesize and f.filesize > 0 %} - {{
                                        (f.filesize/1024/1024)|round(2) }} MB{%
                                        else %} (Boyut bilinmiyor){% endif %}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <button type="submit" class="btn-glow w-100">
                                <i class="bi bi-file-play me-2"></i>Videoyu
                                İndir
                            </button>
                        </form>
                    </div>

                    <!-- Sadece Ses Sekmesi -->
                    <div class="tab-pane fade" id="audioOnly">
                        <form action="{{ url_for('download') }}" method="post">
                            <input
                                type="hidden"
                                name="video_url"
                                value="{{ info.webpage_url }}"
                            />
                            <input
                                type="hidden"
                                name="mode"
                                value="audio_only"
                            />

                            <div class="mb-4">
                                <label class="form-label fw-bold mb-3"
                                    >Ses Kalitesi</label
                                >
                                <select
                                    class="form-select form-select-lg"
                                    name="format_id"
                                    required
                                >
                                    {% for f in audio_only_formats %}
                                    <option
                                        value="{{ f.format_id }}"
                                        class="format-option"
                                    >
                                        {{ f.format }} - {{ f.ext }}{% if f.abr
                                        %} ({{ f.abr }} kbps){% endif %}{% if
                                        f.filesize and f.filesize > 0 %} - {{
                                        (f.filesize/1024/1024)|round(2) }} MB{%
                                        else %} (Boyut bilinmiyor){% endif %}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <button type="submit" class="btn-glow w-100">
                                <i class="bi bi-file-music me-2"></i>MP3 Olarak
                                İndir
                            </button>
                        </form>
                    </div>

                    <!-- Gelişmiş Sekmesi -->
                    <div class="tab-pane fade" id="custom2">
                        <form action="{{ url_for('download') }}" method="post">
                            <input
                                type="hidden"
                                name="video_url"
                                value="{{ info.webpage_url }}"
                            />
                            <input
                                type="hidden"
                                name="mode"
                                value="video_audio"
                            />

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold"
                                        >Video Seçimi</label
                                    >
                                    <select
                                        class="form-select"
                                        name="video_format_id"
                                        required
                                    >
                                        {% for f in video_only_formats %}
                                        <option
                                            value="{{ f.format_id }}"
                                            class="format-option"
                                        >
                                            {{ f.format }} - {{ f.ext }}{% if
                                            f.abr %} ({{ f.abr }} kbps){% endif
                                            %}{% if f.filesize and f.filesize >
                                            0 %} - {{
                                            (f.filesize/1024/1024)|round(2) }}
                                            MB{% else %} (Boyut bilinmiyor){%
                                            endif %}
                                        </option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold"
                                        >Ses Seçimi</label
                                    >
                                    <select
                                        class="form-select"
                                        name="audio_format_id"
                                        required
                                    >
                                        {% for f in audio_only_formats %}
                                        <option
                                            value="{{ f.format_id }}"
                                            class="format-option"
                                        >
                                            {{ f.format }} - {{ f.ext }}{% if
                                            f.abr %} ({{ f.abr }} kbps){% endif
                                            %}{% if f.filesize and f.filesize >
                                            0 %} - {{
                                            (f.filesize/1024/1024)|round(2) }}
                                            MB{% else %} (Boyut bilinmiyor){%
                                            endif %}
                                        </option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                            <button type="submit" class="btn-glow w-100">
                                <i class="bi bi-puzzle me-2"></i>Özelleştirilmiş
                                İndirme
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            const themeSwitch = document.getElementById("themeSwitch");
            const setTheme = (isDark) => {
                document.body.classList.toggle("dark-mode", isDark);
                document.documentElement.setAttribute(
                    "data-bs-theme",
                    isDark ? "dark" : "light"
                );
            };

            themeSwitch.addEventListener("change", () => {
                localStorage.setItem(
                    "darkMode",
                    themeSwitch.checked ? "enabled" : "disabled"
                );
                setTheme(themeSwitch.checked);
            });

            document.addEventListener("DOMContentLoaded", () => {
                const isDark = localStorage.getItem("darkMode") === "enabled";
                themeSwitch.checked = isDark;
                setTheme(isDark);
            });
        </script>
    </body>
</html>
